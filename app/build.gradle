plugins { id 'com.android.application' }

android {
    namespace 'com.spartaneo.adamsbuddy'
    compileSdk 35

    defaultConfig {
        applicationId 'com.spartaneo.adamsbuddy'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.browser:browser:1.10.0'
}
